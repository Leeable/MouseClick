name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MouseClick ${{ github.ref_name }}
          releaseBody: |
            ## 下载

            | 文件 | 说明 |
            | --- | --- |
            | `MouseClick_*_x64-setup.exe` | NSIS 安装包（推荐） |
            | `MouseClick_*_x64_en-US.msi` | MSI 安装包 |
            | `mouse-click.exe` | 便携版可执行文件（需管理员运行） |

            版本号来自 `src-tauri/tauri.conf.json`。
          releaseDraft: false
          prerelease: false
